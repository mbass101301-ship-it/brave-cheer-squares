<style>
:root{--bg:#f7f4fb;--card:#fff;--ink:#1b1f3b;--mut:#666b85;--line:#dcd8ea;--red:#d9262c;--blue:#1f4fb2;--gold:#f5b700;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12141f;--card:#1c2030;--ink:#eef0fa;--mut:#9aa1bd;--line:#323853}}
:root[data-theme="dark"]{--bg:#12141f;--card:#1c2030;--ink:#eef0fa;--mut:#9aa1bd;--line:#323853}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:860px;margin:0 auto;padding:16px}
header{text-align:center}header img{width:150px;max-width:40%}
h1{font-size:1.5rem;margin:.2rem 0}h2{font-size:1.15rem;margin:0 0 .6rem}
.pills{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:.6rem 0}
.pill{background:var(--blue);color:#fff;padding:6px 14px;border-radius:99px;font-weight:700}.pill.r{background:var(--red)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin:14px 0}
input,select,button{font:inherit;padding:9px 10px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);max-width:100%}
input[type=color]{padding:2px;height:40px;width:60px}input[type=checkbox],input[type=radio]{width:auto}
button,.btn{background:var(--blue);color:#fff;border:0;font-weight:700;cursor:pointer;text-decoration:none;display:inline-block;padding:9px 14px;border-radius:8px}
button.s,.btn.s{background:var(--mut)}button.d{background:var(--red)}button.g{background:var(--gold);color:#222}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:end}.row>label{display:flex;flex-direction:column;font-size:.85rem;color:var(--mut);flex:1;min-width:130px}
.row>label input,.row>label select{width:100%}
.scroll{overflow-x:auto}table{border-collapse:collapse;width:100%}
.grid td,.grid th{width:9%;aspect-ratio:1;min-width:30px;text-align:center;border:1px solid var(--line);font-size:.68rem;padding:1px;line-height:1.1;overflow:hidden}
.grid th{font-size:1.1rem;font-weight:800}.open{background:var(--bg);color:var(--mut)}.sold{background:var(--card);font-weight:600}
.win{outline:3px solid var(--gold);outline-offset:-3px;background:#fff3c4!important;color:#222;font-weight:800}
.adm .open{cursor:pointer}.bar{height:10px;border-radius:9px;background:var(--line);overflow:hidden}.bar i{display:block;height:100%;background:var(--red)}
.mut{color:var(--mut);font-size:.9rem}.ok{color:#1a8a4a;font-weight:700}.warn{background:#fff3c4;color:#222;padding:10px;border-radius:8px}
td,th{padding:6px;text-align:left;font-size:.9rem;border-bottom:1px solid var(--line)}.grid td,.grid th{text-align:center}
.qr{width:170px;background:#fff;padding:8px;border-radius:8px}.qr svg{width:100%;height:auto}.tag{font-size:.75rem;padding:2px 8px;border-radius:9px;background:var(--line)}

function payLink(m,amt){const h=(m.handle||"").replace(/^[@$]/,"");
 if(m.type==="venmo")return`https://venmo.com/u/${encodeURIComponent(h)}?txn=pay&amount=${amt}&note=${encodeURIComponent("Brave Cheer squares")}`;
 if(m.type==="cashapp")return`https://cash.app/$${h}/${amt}`;
 if(m.type==="paypal"&&h&&!h.includes("@"))return`https://paypal.me/${h}/${amt}`;return""}
function payHTML(amt){return cfg.payments.filter(m=>m.on).map(m=>{const l=payLink(m,amt);return`<p><b>${esc(m.label)}</b>${m.handle?` — <code>${esc(m.handle)}</code>`:""} ${l?`<a class="btn" target="_blank" rel="noopener" href="${l}">Pay $${amt}</a>`:""}</p>`}).join("")}

function header(b){const bi=b?b.buyIn:cfg.buyIn,po=b?b.payout:cfg.payout;
 return`<header><a href="#"><img src="${LOGO}" alt="Special Olympics Michigan Area 23 Brave Cheer"></a><h1>Football Squares Fundraiser</h1><div class="mut">Supporting Brave Cheer · Special Olympics Michigan Area 23</div><div class="pills"><span class="pill">Buy-in: $${bi} / square</span><span class="pill r">Payout: $${po} / quarter</span></div></header>`}

 let h=`<div class="card"><h2>Games</h2>${list.length?list.map(b=>{const n=tk(b.id).length+(b.stars||[]).length;return`<p><a href="#${b.id}"><b>${esc(b.away)} @ ${esc(b.home)}</b></a> <span class="mut">${when(b.gameAt)}</span> <span class="tag">${b.status==="drawn"?"Numbers drawn":n>=100?"Sold out":(100-n)+" left"}</span></p>`}).join(""):`<p class="mut">No games yet.${admin?"":" Check back soon!"}</p>`}</div>`;
 if(admin)h+=`<div class="card"><h2>Create a fundraiser</h2><form data-f="create"><div class="row"><label>Away preset<select data-p="away"><option value="">Pick a team…</option>${teamOpts}</select></label><label>Away team<input name="away" required placeholder="or type your own"></label><label>Away color<input type="color" name="ac" value="#0076b6"></label></div><br><div class="row"><label>Home preset<select data-p="home"><option value="">Pick a team…</option>${teamOpts}</select></label><label>Home team<input name="home" required placeholder="or type your own"></label><label>Home color<input type="color" name="hc" value="#203731"></label></div><br><div class="row"><label>Game date &amp; time<input type="datetime-local" name="gameAt" required></label><label>Buy-in $<input type="number" name="buyIn" value="${cfg.buyIn}" min="1"></label><label>Payout per quarter $<input type="number" name="payout" value="${cfg.payout}" min="1"></label><button>Generate grid</button></div></form></div>`+settings();
 return h}

function settings(){return`<div class="card"><h2>Payment methods &amp; defaults</h2><div id="pm">${cfg.payments.map((m,i)=>`<div class="row" style="margin-bottom:8px"><label>Label<input data-k="label" value="${esc(m.label)}"></label><label>${esc(m.type)} handle<input data-k="handle" value="${esc(m.handle)}"></label><label style="flex:0;min-width:70px">On<input type="checkbox" data-k="on" ${m.on?"checked":""}></label><button class="d" data-a="rmpay" data-i="${i}">Remove</button></div>`).join("")}</div>

function boardView(b){const ent=tk(b.id),stars=b.stars||[],n=ent.length+stars.length,left=100-n,drawn=b.status==="drawn",full=left<=0;
 const sold=new Set(ent.map(e=>e.idx)),win=new Set(winners(b).map(w=>w.i)),H=b.homeNums,A=b.awayNums;
 const hc=`background:${b.homeColor};color:${ink(b.homeColor)}`,ac=`background:${b.awayColor};color:${ink(b.awayColor)}`;
 let g=`<div class="scroll"><table class="grid ${admin&&!drawn?"adm":""}"><tr><th></th><th colspan="10" style="${hc}">${esc(b.home)} (home) →</th></tr><tr><th style="${ac}">${esc(b.away).slice(0,8)}</th>${[...Array(10)].map((_,c)=>`<th style="${hc}">${H?H[c]:"?"}</th>`).join("")}</tr>`;
 for(let r=0;r<10;r++){g+=`<tr><th style="${ac}">${A?A[r]:"?"}</th>`;for(let c=0;c<10;c++){const i=r*10+c;let t,cl="open";
  if(drawn){const s=b.grid[i]||"";t=s==="★"?"★":esc(s.split("|")[0]);cl="sold"}else if(stars.includes(i)){t="★";cl="sold"}else if(sold.has(i)){t="✔";cl="sold"}else t=admin?"open":"";
  g+=`<td class="${cl} ${win.has(i)?"win":""}" ${admin&&!drawn&&!sold.has(i)?`data-a="star" data-i="${i}"`:""}>${t}</td>`}g+="</tr>"}
 g+="</table></div>";
 let h=header(b)+`<div class="card"><h2>${esc(b.away)} @ ${esc(b.home)}</h2><div class="mut">${when(b.gameAt)}</div><br><div class="bar"><i style="width:${n}%"></i></div><p class="mut">${n} of 100 squares claimed${stars.length?` (${stars.length} ★ house)`:""} · ${drawn?"Numbers drawn — good luck!":full?"Sold out!":"Squares are assigned randomly once the board fills."}</p>${g}${admin&&!drawn?`<p class="mut">Admin: tap an open square to add/remove a ★ (unsold house square).</p>`:""}</div>`;
 const W=winners(b);
 h+=`<div class="card"><h2>Quarter winners</h2>${["q1","q2","q3","q4"].map((q,i)=>{const s=(b.scores||{})[q]||["",""],w=W.find(x=>x.q===q);return`<p>Q${i+1}: ${admin?`${esc(b.home)} <input data-s="${q}h" type="number" value="${s[0]}" style="width:70px"> ${esc(b.away)} <input data-s="${q}a" type="number" value="${s[1]}" style="width:70px">`:""} ${w?`<b>${esc(b.home)} ${w.h} – ${esc(b.away)} ${w.a}</b> → <span class="ok">${w.who==="★"?"House square":esc(w.who)} wins $${b.payout}</span>`:`<span class="mut">pending</span>`}</p>`}).join("")}${admin?`<button data-a="savescores">Save scores</button>`:""}</div>`;
 if(!drawn&&!full||admin&&!drawn){h+=`<div class="card"><h2>${admin?"Add a buyer":"Buy squares"} <span class="mut">($${b.buyIn} each · ${left} left)</span></h2>${receipt&&!admin?`<div class="warn"><b>Thanks, ${esc(receipt.name)}!</b> Your ${receipt.qty} square(s) are reserved — total <b>$${receipt.total}</b>. Pay below so we can confirm.<br>${receipt.sent?"":"Your request was saved."}</div>${receipt.method==="cash"?"<p>Please give cash directly to Melissa.</p>":""}${payHTML(receipt.total)}`:""}${flash?`<div class="warn">${flash}</div>`:""}
<form data-f="buy"><div class="row"><label>First name<input name="first" required></label><label>Last name<input name="last" required></label></div><br><div class="row"><label>Phone<input name="phone" type="tel" required></label><label>Email<input name="email" type="email" required></label></div><br><div class="row"><label>How many squares<input name="qty" type="number" min="1" max="${Math.max(left,1)}" value="1" required></label><label>Pay with<select name="method">${cfg.payments.filter(m=>m.on).map(m=>`<option value="${m.id}">${esc(m.label)}</option>`).join("")}</select></label>${admin?`<label style="flex:0;min-width:90px">Paid<input type="checkbox" name="paid"></label>`:""}<button ${full?"disabled":""}>${admin?"Add":"Reserve my squares"}</button></div><p class="mut">Your info is only seen by the fundraiser organizer.</p></form></div>`}
 if(admin)h+=adminPanel(b,drawn,full);
 return h}

function adminPanel(b,drawn,full){const bs=Object.values(buyers).filter(x=>x.b===b.id),u=link(b.id),paid=bs.filter(x=>x.paid).reduce((s,x)=>s+x.qty,0),tot=bs.reduce((s,x)=>s+x.qty,0);
 const cap=`Join our Brave Cheer football squares for ${b.away} vs ${b.home}! $${b.buyIn} a square, $${b.payout} paid every quarter. All proceeds support our Special Olympics cheer team 🏈📣 Grab your square: ${u}`;
 let h=`<div class="card"><h2>Admin dashboard</h2><p>Raised: <b>$${tot*b.buyIn}</b> · Collected: <b>$${paid*b.buyIn}</b> · Outstanding: <b>$${(tot-paid)*b.buyIn}</b> · Payouts: $${b.payout*4} · Net if sold out: <b>$${100*b.buyIn-4*b.payout}</b></p>
<div class="scroll"><table><tr><th>Buyer</th><th>Contact</th><th>Sq</th><th>Method</th><th>Paid</th><th></th></tr>${bs.map(x=>`<tr><td>${esc(x.first)} ${esc(x.last)}</td><td>${esc(x.phone)}<br>${esc(x.email)}</td><td>${x.qty}</td><td>${esc(x.method)} · $${x.qty*b.buyIn}</td><td><input type="checkbox" data-a="paid" data-id="${x.id}" ${x.paid?"checked":""}></td><td>${drawn?"":`<button class="d" data-a="rmbuyer" data-id="${x.id}">✕</button>`}</td></tr>`).join("")||`<tr><td colspan="6" class="mut">No buyers yet.</td></tr>`}</table></div>
<br>${!drawn?`<button class="g" data-a="draw" ${full?"":"disabled"}>Draw numbers &amp; assign squares now</button> <span class="mut">${full?"Board is full — this also runs automatically.":"Unlocks when all 100 squares are sold or starred."}</span>`:""}</div>
<div class="card"><h2>Share &amp; promote</h2><div class="row" style="align-items:start"><div class="qr" id="qr" data-u="${esc(u)}"></div><div style="flex:1;min-width:220px"><p class="mut">Scan the QR code or use the link:</p><input readonly value="${esc(u)}" style="width:100%"><br><br><textarea readonly rows="4" style="width:100%;font:inherit;padding:8px">${esc(cap)}</textarea><br><br><button data-a="copy" data-t="${esc(cap)}">Copy caption</button> <a class="btn s" target="_blank" rel="noopener" href="https://www.facebook.com/sharer/sharer.php?u=${encodeURIComponent(u)}&quote=${encodeURIComponent(cap)}">Facebook</a> <a class="btn s" target="_blank" rel="noopener" href="https://twitter.com/intent/tweet?text=${encodeURIComponent(cap)}">X</a> <button class="s" data-a="share" data-t="${esc(cap)}" data-u="${esc(u)}">More…</button><br><br><button class="g" data-a="img">📸 Create post image</button>${postImg&&postImg.id===b.id?`<p class="mut">Save this and attach it to your post. It shows the logo, the live board and the QR code.</p><img src="${postImg.url}" alt="Post image" style="width:100%;max-width:420px;border-radius:10px"><br><button data-a="saveimg">Save image</button> <button class="s" data-a="shareimg" data-t="${esc(cap)}">Share image</button>`:""}</div></div></div>`;
 if(drawn){h+=`<div class="card"><h2>Send everyone their squares</h2><p class="mut">Tap to open a pre-filled email or text for each buyer (your device sends it).</p>${bs.map(x=>{const mine=[];(b.grid||[]).forEach((s,i)=>{if(s.endsWith("|"+x.id))mine.push(`${b.away} ${b.awayNums[Math.floor(i/10)]} / ${b.home} ${b.homeNums[i%10]}`)});
  const body=`Hi ${x.first}! The Brave Cheer squares board for ${b.away} @ ${b.home} is set.\nYour squares:\n${mine.join("\n")}\n\nFull board: ${link(b.id)}\n\n`+textGrid(b)+`\nThank you for supporting Special Olympics Brave Cheer!`;
  return`<p><b>${esc(x.first)} ${esc(x.last)}</b> <a class="btn s" href="mailto:${encodeURIComponent(x.email)}?subject=${encodeURIComponent("Your Brave Cheer squares")}&body=${encodeURIComponent(body)}">Email</a> <a class="btn s" href="sms:${encodeURIComponent(x.phone)}?&body=${encodeURIComponent(body.split("\n\n")[0]+"\n\nBoard: "+link(b.id))}">Text</a></p>`}).join("")}</div>`}
 h+=`<div class="card"><button class="s" data-a="dup">Duplicate for another game</button> <button class="d" data-a="delboard">Delete this board</button></div>`;return h}

function textGrid(b){let t="      "+b.homeNums.map(n=>String(n).padStart(6)).join("")+"\n";for(let r=0;r<10;r++){t+=String(b.awayNums[r]).padEnd(4)+" ";for(let c=0;c<10;c++)t+=((b.grid[r*10+c]||"").split("|")[0].split(" ")[0].slice(0,5)).padStart(6);t+="\n"}return t}

function render(){if(!db&&ready){$app.innerHTML=header()+`<div class="card"><p>Setup isn’t finished yet. Paste your Firebase settings into the CONFIG section at the top of index.html.</p></div>`;return}
 if(!ready){return}
 const b=boards[bid()];$app.innerHTML=(bid()&&b?boardView(b):home().replace(/^/,header()))+`<p class="mut" style="text-align:center"><a href="#" data-a="${admin?"logout":"login"}">${admin?"Sign out":"Admin login"}</a></p>`+`<p class="mut" style="text-align:center">${bid()&&!b?'<a href="#">← All games</a>':""}</p>`;
 const q=document.getElementById("qr");if(q&&window.qrcode){const c=qrcode(0,"M");c.addData(q.dataset.u);c.make();q.innerHTML=c.createSvgTag(6)}}
let postImg=null;
async function makePost(b){const W=1080,c=document.createElement("canvas");c.width=c.height=W;const x=c.getContext("2d");
 const T=(t,px,y,col,xx,w,al,mw)=>{while(px>16){x.font=`${w} ${px}px system-ui,Arial,sans-serif`;if(!mw||x.measureText(t).width<=mw)break;px-=2}x.fillStyle=col;x.textAlign=al||"left";x.fillText(t,xx,y)};
 const pill=(px,y,t,col)=>{x.font="800 36px system-ui,Arial,sans-serif";const w=x.measureText(t).width+44;x.fillStyle=col;x.beginPath();x.roundRect(px,y,w,60,30);x.fill();x.fillStyle="#fff";x.textAlign="left";x.fillText(t,px+22,y+42);return w};
 x.fillStyle="#fff";x.fillRect(0,0,W,W);x.fillStyle="#f1ecf9";x.fillRect(0,0,W,385);
 const im=new Image();im.src=LOGO;await im.decode();x.drawImage(im,35,35,270,270);
 T("FOOTBALL SQUARES",72,115,"#d9262c",330,"800","left",700);T("Brave Cheer Fundraiser",38,165,"#1f4fb2",330,"700","left",700);
 T(`${b.away} @ ${b.home}`,46,228,"#1b1f3b",330,"800","left",710);T(when(b.gameAt),32,275,"#555b78",330,"600","left",710);
 const w1=pill(330,305,`$${b.buyIn} / SQUARE`,"#1f4fb2");pill(330+w1+14,305,`$${b.payout} / QUARTER`,"#d9262c");
 const ent=tk(b.id),sold=new Set(b.status==="drawn"?(b.grid||[]).map((s,i)=>s==="★"?-1:i):ent.map(e=>e.idx)),stars=new Set(b.status==="drawn"?(b.grid||[]).map((s,i)=>s==="★"?i:-1):b.stars||[]);
 const gx=50,gy=415,cs=50;x.textAlign="center";
 for(let i=0;i<10;i++){x.fillStyle=b.homeColor;x.fillRect(gx+(i+1)*cs,gy,cs,cs);x.fillStyle=ink(b.homeColor);x.font="800 26px system-ui,Arial";x.fillText(b.homeNums?b.homeNums[i]:"?",gx+(i+1)*cs+cs/2,gy+34);
  x.fillStyle=b.awayColor;x.fillRect(gx,gy+(i+1)*cs,cs,cs);x.fillStyle=ink(b.awayColor);x.fillText(b.awayNums?b.awayNums[i]:"?",gx+cs/2,gy+(i+1)*cs+34)}
 for(let r=0;r<10;r++)for(let k=0;k<10;k++){const i=r*10+k,px=gx+(k+1)*cs,py=gy+(r+1)*cs;x.fillStyle=stars.has(i)?"#f5b700":sold.has(i)?"#d9262c":"#fff";x.fillRect(px,py,cs,cs);x.strokeStyle="#cfc9e0";x.lineWidth=1;x.strokeRect(px,py,cs,cs);if(stars.has(i)||sold.has(i)){x.fillStyle=stars.has(i)?"#222":"#fff";x.font="700 24px system-ui,Arial";x.fillText(stars.has(i)?"★":"✔",px+cs/2,py+34)}}
 const q=qrcode(0,"M");q.addData(link(b.id));q.make();const n=q.getModuleCount(),m=Math.floor(300/n),qs=m*n,qx=830-qs/2;x.fillStyle="#fff";x.fillRect(qx-14,420,qs+28,qs+28);x.strokeStyle="#1f4fb2";x.lineWidth=4;x.strokeRect(qx-14,420,qs+28,qs+28);x.fillStyle="#000";
 for(let r=0;r<n;r++)for(let k=0;k<n;k++)if(q.isDark(r,k))x.fillRect(qx+k*m,434+r*m,m,m);
 const left=100-ent.length-(b.stars||[]).length;T("Scan to grab a square!",34,800,"#1b1f3b",830,"800","center",380);T(left>0?`${left} of 100 squares left`:"Sold out!",36,850,"#d9262c",830,"800","center",380);T("Numbers drawn when the board fills",24,895,"#555b78",830,"600","center",380);
 x.fillStyle="#d9262c";x.fillRect(0,990,W,90);T("All proceeds support Special Olympics Michigan Area 23 · Brave Cheer",30,1043,"#fff",W/2,"800","center",1000);
 return new Promise(r=>c.toBlob(r,"image/png"))}
function upd(){const a=document.activeElement;if(!a||!a.matches||!a.matches("input:not([type=checkbox]),select,textarea"))render()}
window.addEventListener("hashchange",()=>{flash="";receipt=null;render()});

async function buyNow(b,p,byAdmin){const id=rid(),used=new Set([...tk(b.id).map(e=>e.idx),...(b.stars||[])]);
 const free=shuf([...Array(100).keys()].filter(i=>!used.has(i)));const qty=Math.min(+p.qty,free.length),slots=free.slice(0,qty);if(!qty)throw Error("sold out");
 await db.doc("buyers/"+id).set({...p,b:b.id,qty,slots,paid:!!p.paid,ts:Date.now()});
 for(const i of slots)await db.doc(`taken/${b.id}_${i}`).set({b:b.id,idx:i,buyer:id,name:p.first+" "+(p.last[0]||"")+"."});return qty}
async function draw(b){if(drawing||b.status==="drawn")return;drawing=true;try{const ent=shuf(tk(b.id)),stars=b.stars||[],pos=shuf([...Array(100).keys()].filter(i=>!stars.includes(i))),grid=Array(100).fill("★");
 ent.forEach((e,k)=>grid[pos[k]]=e.name+"|"+e.buyer);
 await db.doc("boards/"+b.id).update({grid,homeNums:shuf([...Array(10).keys()]),awayNums:shuf([...Array(10).keys()]),status:"drawn",drawnAt:Date.now()})}finally{drawing=false}}
function autoDraw(){if(!admin)return;Object.values(boards).forEach(b=>{if(b.status!=="drawn"&&tk(b.id).length+(b.stars||[]).length>=100&&tk(b.id).length>0)draw(b)})}

document.addEventListener("submit",async e=>{e.preventDefault();const f=e.target,d=Object.fromEntries(new FormData(f));
 if(f.dataset.f==="create"){const id="b-"+rid();await db.doc("boards/"+id).set({home:d.home,away:d.away,homeColor:d.hc,awayColor:d.ac,gameAt:d.gameAt,buyIn:+d.buyIn,payout:+d.payout,status:"open",stars:[],scores:{},ts:Date.now()});location.hash=id}
 if(f.dataset.f==="buy"){const b=boards[bid()];d.paid=!!d.paid;flash="";
  try{const qty=await buyNow(b,d,admin);if(!admin)receipt={name:d.first,qty,total:qty*b.buyIn,method:d.method,sent:true};else flash="Added "+esc(d.first)+" ✔"}
  catch(err){const m=`New squares request — ${b.away} @ ${b.home}\nName: ${d.first} ${d.last}\nPhone: ${d.phone}\nEmail: ${d.email}\nSquares: ${d.qty}\nPay with: ${d.method}`;
   flash=`We couldn’t save this online. Please <a href="mailto:mbass101301@gmail.com?subject=${encodeURIComponent("Squares request")}&body=${encodeURIComponent(m)}"><b>tap here to email your request to Melissa</b></a> and she’ll reserve your squares.`}
  render()}});
const A={
 async star(d){const b=boards[bid()],s=new Set(b.stars||[]);s.has(+d.i)?s.delete(+d.i):s.add(+d.i);await db.doc("boards/"+b.id).update({stars:[...s]})},
 async paid(d,e){await db.doc("buyers/"+d.id).update({paid:e.target.checked})},
 async rmbuyer(d){if(!confirm("Remove this purchase?"))return;const x=buyers[d.id];for(const i of x.slots)await db.doc(`taken/${x.b}_${i}`).delete();await db.doc("buyers/"+d.id).delete()},
 async draw(){await draw(boards[bid()])},
 async savescores(){const s={};["q1","q2","q3","q4"].forEach(q=>s[q]=[document.querySelector(`[data-s=${q}h]`).value,document.querySelector(`[data-s=${q}a]`).value]);await db.doc("boards/"+bid()).update({scores:s})},
 copy(d){navigator.clipboard.writeText(d.t);flash="Caption copied ✔";render()},
 share(d){navigator.share?navigator.share({text:d.t,url:d.u}).catch(()=>{}):A.copy(d)},
 async dup(){const b=boards[bid()],id="b-"+rid();await db.doc("boards/"+id).set({home:b.home,away:b.away,homeColor:b.homeColor,awayColor:b.awayColor,gameAt:"",buyIn:b.buyIn,payout:b.payout,status:"open",stars:[],scores:{},ts:Date.now()});location.hash=id},
 async delboard(){const b=boards[bid()];if(!confirm("Delete this board and all its buyers?"))return;for(const t of tk(b.id))await db.doc(`taken/${b.id}_${t.idx}`).delete();for(const x of Object.values(buyers).filter(x=>x.b===b.id))await db.doc("buyers/"+x.id).delete();await db.doc("boards/"+b.id).delete();location.hash=""},
 async login(d,e){e.preventDefault();const em=prompt("Admin email:"),pw=em&&prompt("Admin password:");if(!pw)return;try{await FB.auth.signInWithEmailAndPassword(em,pw);location.reload()}catch(x){alert("Sign-in failed. Check your email and password.")}},
 async logout(d,e){e.preventDefault();await FB.auth.signOut();location.reload()},
 async img(){const b=boards[bid()];const blob=await makePost(b);postImg={id:b.id,blob,url:URL.createObjectURL(blob)};render()},
 async saveimg(){const d=await claude.use("downloads");if(!d){alert("Press and hold the image to save it.");return}try{await d.save({filename:"brave-cheer-squares.png",data:postImg.blob})}catch(e){}},
 async shareimg(d){const f=new File([postImg.blob],"brave-cheer-squares.png",{type:"image/png"});try{if(navigator.canShare&&navigator.canShare({files:[f]}))await navigator.share({files:[f],text:d.t});else A.saveimg()}catch(e){}},
 rmpay(d){cfg={...cfg,payments:cfg.payments.filter((_,i)=>i!==+d.i)};render()},
 addpay(){const t=document.getElementById("newpay").value;cfg={...cfg,payments:[...cfg.payments,{id:t+rid(),type:t,label:{cashapp:"Cash App"}[t]||t[0].toUpperCase()+t.slice(1),handle:"",on:true}]};render()},
 async savecfg(){const rows=[...document.querySelectorAll("#pm .row")].map((r,i)=>({...cfg.payments[i],label:r.querySelector("[data-k=label]").value,handle:r.querySelector("[data-k=handle]").value,on:r.querySelector("[data-k=on]").checked}));
  cfg={payments:rows,buyIn:+document.getElementById("dbi").value,payout:+document.getElementById("dpo").value};await db.doc("settings/config").set(cfg);flash="";alert("Saved ✔")}};
document.addEventListener("click",e=>{const t=e.target.closest("[data-a]");if(!t||t.tagName==="INPUT"&&e.type==="click"&&t.dataset.a==="paid"&&false)return;if(t.tagName==="INPUT")return;A[t.dataset.a]?.(t.dataset,e)});
document.addEventListener("change",e=>{const t=e.target;if(t.dataset.a==="paid")A.paid(t.dataset,e);if(t.dataset.p&&t.value){const f=t.form,k=t.dataset.p;f[k].value=t.selectedOptions[0].text;f[k=="away"?"ac":"hc"].value=t.value}});

(async()=>{setTimeout(()=>{if(!ready){ready=true;render()}},10000);
 try{db=await claude.use("db");user=await claude.use("user");admin=user?await user.canEdit():false}catch(e){db=null}
 if(!db){ready=true;render();return}
 const er=()=>{};
 db.collection("boards").onSnapshot(s=>{boards={};s.docs.forEach(d=>boards[d.id]={id:d.id,...d.data()});ready=true;upd();autoDraw()},er);
 db.collection("taken").onSnapshot(s=>{taken={};s.docs.forEach(d=>taken[d.id]=d.data());upd();autoDraw()},er);
 db.doc("settings/config").onSnapshot(s=>{if(s.exists)cfg={...DEF,...s.data()};upd()},er);
 if(admin)db.collection("buyers").onSnapshot(s=>{buyers={};s.docs.forEach(d=>buyers[d.id]={id:d.id,...d.data()});upd()},er)})();
